<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday Pi</title>
<style>
  :root { --bg: #1d1b2f; --fg: #fdf6ec; --accent: #ffb347; --muted: #b9b3cc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; text-align: center; }
  .logo { font-size: 12vh; line-height: 1; }
  h1 { margin: 0; font-size: 8vh; font-weight: 700; }
  h1 span { color: var(--accent); }
  #clock { font-size: 14vh; font-weight: 300; font-variant-numeric: tabular-nums; }
  #date { font-size: 4vh; color: var(--muted); }
  .status { margin-top: 4vh; font-size: 2.6vh; color: var(--muted); }

  /* Photo slideshow: shown after inactivity, crossfades between two layers. */
  #photos { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2s ease; }
  body.photos #photos { opacity: 1; }
  #photos img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 2s ease; }
  #photos img.show { opacity: 1; }
  #photo-clock { position: absolute; right: 3vw; bottom: 3vh; font-size: 6vh; font-weight: 300;
    font-variant-numeric: tabular-nums; text-shadow: 0 0 1.5vh #000; }

  /* Active reminder banner, kept visible over the photos. */
  #reminder { position: fixed; left: 0; right: 0; top: 0; padding: 3vh 4vw; background: var(--accent); color: #1d1b2f;
    font-size: 5vh; font-weight: 700; text-align: center; display: none; }
  body.has-reminder #reminder { display: block; }

  /* Night dim: 85% dark from 10pm to 5am while idle; any input or new reminder lifts it. */
  #night { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 3s ease; }
  body.night #night { opacity: 0.85; }
  body.idle-cursor { cursor: none; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">🎂</div>
  <h1>Birthday <span>Pi</span></h1>
  <div id="clock">--:--</div>
  <div id="date"></div>
  <div class="status">Placeholder screen · the real app is coming soon</div>
</main>
<div id="photos"><img alt=""><img alt=""><div id="photo-clock"></div></div>
<div id="reminder"></div>
<div id="night"></div>
<script>
  // Timings; URL params override for testing, e.g. ?idle=10&photo=5&night=22-5&person=sample-person (their day)
  const params = new URLSearchParams(location.search);
  const IDLE_MS = (Number(params.get("idle")) || 5 * 60) * 1000;   // inactivity before photos / night dim
  const PHOTO_MS = (Number(params.get("photo")) || 60) * 1000;     // time each photo stays up
  const [NIGHT_START, NIGHT_END] = (params.get("night") || "22-5").split("-").map(Number);
  const CURSOR_MS = 5000;

  let lastActive = Date.now();
  let photoList = [], photoIdx = -1, photoTimer = null, front = 0;
  let seenReminders = null;
  let photoFolder = params.get("person") || "";  // set on a celebration day: only that person's photos

  function wake() { lastActive = Date.now(); update(); }
  ["mousemove", "mousedown", "touchstart", "keydown", "wheel"].forEach(e =>
    window.addEventListener(e, wake, { passive: true }));

  function isNight(d) {
    const h = d.getHours();
    return NIGHT_START > NIGHT_END ? (h >= NIGHT_START || h < NIGHT_END) : (h >= NIGHT_START && h < NIGHT_END);
  }

  function update() {
    const now = new Date();
    const idle = Date.now() - lastActive;
    const time = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    document.getElementById("clock").textContent = time;
    document.getElementById("photo-clock").textContent = time;
    document.getElementById("date").textContent =
      now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });

    const cl = document.body.classList;
    cl.toggle("idle-cursor", idle >= CURSOR_MS);
    cl.toggle("night", idle >= IDLE_MS && isNight(now));
    const showPhotos = idle >= IDLE_MS && photoList.length > 0;
    if (showPhotos && !cl.contains("photos")) { cl.add("photos"); nextPhoto(); photoTimer = setInterval(nextPhoto, PHOTO_MS); }
    if (!showPhotos && cl.contains("photos")) { cl.remove("photos"); clearInterval(photoTimer); }
  }

  function nextPhoto() {
    if (!photoList.length) return;
    photoIdx = (photoIdx + 1) % photoList.length;
    const imgs = document.querySelectorAll("#photos img");
    const next = imgs[1 - front];
    next.onload = () => { next.classList.add("show"); imgs[front].classList.remove("show"); front = 1 - front; };
    next.src = photoList[photoIdx];
  }

  // nginx lists folders as JSON; any image dropped in a folder joins the slideshow.
  // photos/ and photos/<person>/ folders: on a person's day only theirs show, otherwise all of them.
  async function listDir(dir) {
    try { return await (await fetch(dir, { cache: "no-store" })).json(); } catch { return []; }
  }
  async function listImages(dir) {
    return (await listDir(dir)).filter(f => f.type === "file" && /\.(jpe?g|png|webp|gif|svg)$/i.test(f.name))
      .map(f => dir + encodeURIComponent(f.name));
  }
  const folderUrl = name => "/photos/" + encodeURIComponent(name) + "/";
  async function loadPhotos() {
    const personal = photoFolder ? await listImages(folderUrl(photoFolder)) : [];
    if (personal.length) { photoList = personal; return; }
    const folders = (await listDir("/photos/")).filter(f => f.type === "directory").map(f => folderUrl(f.name));
    const lists = await Promise.all(["/photos/", ...folders].map(listImages));
    photoList = lists.flat().sort(() => Math.random() - 0.5);
  }

  // Placeholder reminder feed: [{ "id": "...", "text": "...", "photos": "<person folder>", "today": true }].
  // On the person's day (a reminder with "photos" and "today"), only their photos show.
  // A reminder not seen before wakes the screen.
  async function loadReminders() {
    try {
      const list = await (await fetch("/reminders.json", { cache: "no-store" })).json();
      const ids = new Set(list.map(r => r.id));
      if (seenReminders && list.some(r => !seenReminders.has(r.id))) wake();
      seenReminders = ids;
      const folder = params.get("person") || (list.find(r => r.photos && r.today) || {}).photos || "";
      if (folder !== photoFolder) { photoFolder = folder; photoIdx = -1; loadPhotos(); }
      document.getElementById("reminder").textContent = list.map(r => r.text).join("  ·  ");
      document.body.classList.toggle("has-reminder", list.length > 0);
    } catch { /* keep the last known state */ }
  }

  update(); setInterval(update, 1000);
  loadPhotos(); setInterval(loadPhotos, 10 * 60 * 1000);
  loadReminders(); setInterval(loadReminders, 30 * 1000);
</script>
</body>
</html>
