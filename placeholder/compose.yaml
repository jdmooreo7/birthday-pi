# Placeholder web server for the monitor until the real app exists.
services:
  web:
    image: nginx:1.27-alpine-slim
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./photos:/photos:ro
    mem_limit: 32m
