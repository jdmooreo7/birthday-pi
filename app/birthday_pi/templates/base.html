<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Birthday Pi{% endblock %}</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/phone.css">
</head>
<body>

</body>
</html>
