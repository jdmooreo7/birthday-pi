{# Month / day / optional year selects. Expects prefix, label, values, errors, this_year. #}
<div class="dates">
  <div class="field{% if errors[prefix ~ '_month'] %} has-error{% endif %}">
    <label for="{{ prefix }}_month">Month</label>
    <select id="{{ prefix }}_month" name="{{ prefix }}_month">
      <option value="">–</option>
      {% for m in MONTHS %}<option value="{{ loop.index }}"{% if values[prefix ~ '_month'] == loop.index | string %} selected{% endif %}>{{ m }}</option>{% endfor %}
    </select>
  </div>
  <div class="field{% if errors[prefix ~ '_day'] %} has-error{% endif %}">
    <label for="{{ prefix }}_day">Day</label>
    <select id="{{ prefix }}_day" name="{{ prefix }}_day">
      <option value="">–</option>
      {% for d in range(1, 32) %}<option value="{{ d }}"{% if values[prefix ~ '_day'] == d | string %} selected{% endif %}>{{ d }}</option>{% endfor %}
    </select>
  </div>
  <div class="field{% if errors[prefix ~ '_year'] %} has-error{% endif %}">
    <label for="{{ prefix }}_year">Year <span class="muted small" style="font-weight: 400">(optional)</span></label>
    <input id="{{ prefix }}_year" name="{{ prefix }}_year" inputmode="numeric" maxlength="4" value="{{ values[prefix ~ '_year'] }}" placeholder="{{ this_year }}">
  </div>
</div>
{% for k in ('_month', '_day', '_year') %}{% if errors[prefix ~ k] %}<div class="error">{{ errors[prefix ~ k] }}</div>{% endif %}{% endfor %}
