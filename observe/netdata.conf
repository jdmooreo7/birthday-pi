# Netdata for Birthday Pi (compose profile "observe").
# Metrics are kept on disk (the netdata-cache volume) so a reboot or an update doesn't lose them:
# every second for 2 days, then every minute for 7 days, at most 256 MB in all.
[db]
    mode = dbengine
    update every = 1
    storage tiers = 2
    dbengine page cache size = 32MiB
    dbengine tier 0 retention size = 192MiB
    dbengine tier 0 retention time = 2d
    dbengine tier 1 retention size = 64MiB
    dbengine tier 1 retention time = 7d

[ml]
    # Anomaly detection costs CPU and memory we'd rather give the face worker.
    enabled = no

[web]
    bind to = *
