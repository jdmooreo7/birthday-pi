# Keep the system journal on disk, so the reason for a freeze or a blank screen survives a reboot.
# Raspberry Pi OS keeps it in memory only (40-rpi-volatile-storage.conf); this file sorts later and wins.
# Install: sudo cp scripts/journald-birthday-pi.conf /etc/systemd/journald.conf.d/50-birthday-pi.conf
#          sudo systemctl restart systemd-journald
# Undo:    sudo rm /etc/systemd/journald.conf.d/50-birthday-pi.conf && sudo systemctl restart systemd-journald
[Journal]
Storage=persistent
SystemMaxUse=200M
